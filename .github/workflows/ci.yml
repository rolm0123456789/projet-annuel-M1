name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend - build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore backend/Gateway/Gateway.sln

      - name: Build
        run: dotnet build backend/Gateway/Gateway.sln --no-restore -c Release

      - name: Tests
        run: |
          dotnet test backend/Gateway/OrderService.Tests/OrderService.Tests.csproj -c Release
          dotnet test backend/Gateway/InventoryService.Tests/InventoryService.Tests.csproj -c Release

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Dette technique : erreurs TypeScript historiques, non bloquantes pour l'instant.
      - name: Typecheck
        run: npx tsc -b
        continue-on-error: true

      - name: Build
        run: npx vite build

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build des images
        run: docker compose build

  deploy:
    name: Déploiement Coolify
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Déclenchement du webhook Coolify
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "Secret COOLIFY_WEBHOOK_URL absent : étape de déploiement ignorée."
            exit 0
          fi
          curl --fail -X POST "$COOLIFY_WEBHOOK_URL" \
            ${COOLIFY_TOKEN:+-H "Authorization: Bearer $COOLIFY_TOKEN"}
