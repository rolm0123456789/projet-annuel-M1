# N'active l'upgrade WebSocket que lorsque le client le demande (SignalR).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les appels API sont proxifiés vers la Gateway (même origine côté navigateur).
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Support WebSocket (SignalR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # SPA : toutes les routes retombent sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
